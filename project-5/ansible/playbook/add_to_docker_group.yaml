---
- name: Add user to docker group
  hosts: "{{host_name}}"
  become: true # escalate privileges

  vars:
    username: jenkins # change this to your user

  tasks:
    - name: Ensure docker group exists
      group:
        name: docker
        state: present

    - name: Add user to docker group
      user:
        name: "{{ username }}"
        groups: docker
        append: yes # don't remove existing groups
